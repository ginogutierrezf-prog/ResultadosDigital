<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Dashboard Cobranza Digital · Mayo 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f4f8;--surface:#fff;--surface2:#f7f9fc;--surface3:#edf0f5;
  --border:#e2e7ef;--border2:#c9d2e0;
  --bcp:#1a5fd4;--bcp-pale:rgba(26,95,212,.08);--bcp-glow:rgba(26,95,212,.14);
  --yape:#e0500a;--yape-pale:rgba(224,80,10,.08);--yape-glow:rgba(224,80,10,.14);
  --pre:#7c3aed;--pre-pale:rgba(124,58,237,.08);
  --dig:#1a5fd4;--trad:#64748b;--trad-pale:rgba(100,116,139,.1);
  --tot:#0f766e;
  --green:#15803d;--green-bg:rgba(21,128,61,.09);
  --red:#b91c1c;--red-bg:rgba(185,28,28,.09);
  --amber:#b45309;--amber-bg:rgba(180,83,9,.08);
  --text:#111827;--text2:#374151;--text3:#6b7280;--text4:#9ca3af;
  --sans:'Plus Jakarta Sans',sans-serif;--mono:'JetBrains Mono',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.09);--r:11px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* HEADER */
.hdr{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:300;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hdr-left{display:flex;align-items:center;gap:11px;}
.hdr-logo{width:32px;height:32px;flex-shrink:0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#1a5fd4,#7c3aed);}
.hdr-title{font-size:15px;font-weight:700;}
.hdr-badges{display:flex;gap:6px;align-items:center;}
.badge{font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 9px;border-radius:20px;border:1px solid var(--border2);color:var(--text2);background:var(--surface2);}
.badge.green{color:var(--green);border-color:rgba(21,128,61,.28);background:rgba(21,128,61,.07);}
.badge.blue{color:var(--bcp);border-color:rgba(26,95,212,.28);background:var(--bcp-pale);}

/* MAIN TABS */
.main-tabs{display:flex;gap:0;background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;position:sticky;top:57px;z-index:200;}
.main-tab{padding:11px 20px;border:none;background:transparent;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text3);border-bottom:3px solid transparent;transition:all .16s;margin-bottom:-1px;}
.main-tab:hover{color:var(--text2);}
.main-tab.active{color:var(--bcp);border-bottom-color:var(--bcp);}
.main-tab .tab-icon{margin-right:6px;font-size:14px;}

/* PAGE CONTAINERS */
.page{display:none;}
.page.active{display:block;}

/* ══════════════════════════════════
   INDICADORES PAGE
══════════════════════════════════ */
.ind-page{padding:24px 24px 40px;}

/* Entity selector */
.ind-entity-bar{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;align-items:center;}
.ind-ent-btn{padding:7px 18px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--text3);transition:all .16s;}
.ind-ent-btn.bcp.active{color:var(--bcp);border-color:var(--bcp);background:var(--bcp-pale);}
.ind-ent-btn.yape.active{color:var(--yape);border-color:var(--yape);background:var(--yape-pale);}
.ind-ent-btn.b120.active{color:var(--pre);border-color:var(--pre);background:var(--pre-pale);}
.ind-ent-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;background:currentColor;}
.ind-label{font-family:var(--mono);font-size:10px;color:var(--text3);margin-left:6px;}

/* Section title */
.ind-section-title{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
.ind-section-sub{font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:20px;}

/* DELTA CARDS */
.delta-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
.delta-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.delta-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0;}
.delta-card.bcp::before{background:var(--bcp);}
.delta-card.yape::before{background:var(--yape);}
.delta-card.b120::before{background:var(--pre);}
.delta-label{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
.delta-val{font-size:22px;font-weight:800;letter-spacing:-.8px;line-height:1;margin-bottom:6px;}
.delta-card.bcp .delta-val{color:var(--bcp);}
.delta-card.yape .delta-val{color:var(--yape);}
.delta-card.b120 .delta-val{color:var(--pre);}
.delta-sub{font-family:var(--mono);font-size:10px;color:var(--text3);margin-bottom:8px;}
.delta-change{display:flex;align-items:center;gap:6px;padding-top:8px;border-top:1px solid var(--border);}
.delta-arrow{font-size:11px;font-weight:700;font-family:var(--mono);}
.delta-arrow.up{color:var(--green);}
.delta-arrow.down{color:var(--red);}
.delta-arrow.flat{color:var(--amber);}
.delta-vs{font-family:var(--mono);font-size:10px;color:var(--text3);}

/* CANAL BREAKDOWN inside delta card */
.canal-mini{display:flex;flex-direction:column;gap:3px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.canal-mini-row{display:flex;align-items:center;justify-content:space-between;}
.canal-mini-label{font-family:var(--mono);font-size:9px;color:var(--text3);display:flex;align-items:center;gap:4px;}
.canal-mini-dot{width:6px;height:6px;border-radius:50%;}
.canal-mini-val{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--text2);}
.canal-mini-pct{font-family:var(--mono);font-size:9px;color:var(--text4);}

/* TREND CHARTS */
.trend-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;}
.trend-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);}
.trend-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;}
.trend-sub{font-family:var(--mono);font-size:9.5px;color:var(--text3);margin-bottom:14px;}

/* CORTE TABLE */
.corte-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:28px;}
.corte-table-hdr{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:space-between;}
.corte-table-title{font-size:13px;font-weight:700;color:var(--text);}
.corte-scroll{overflow-x:auto;}
.corte-table{width:100%;border-collapse:collapse;min-width:700px;}
.corte-table thead tr{background:var(--surface2);}
.corte-table th{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--text3);padding:9px 13px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);}
.corte-table th:first-child{text-align:left;}
.corte-table th.th-pre{color:var(--pre);}
.corte-table th.th-dig{color:var(--bcp);}
.corte-table th.th-trad{color:var(--trad);}
.corte-table tbody tr{border-top:1px solid var(--border);transition:background .09s;}
.corte-table tbody tr:hover{background:var(--surface2);}
.corte-table tbody tr.row-date{background:var(--surface3);}
.corte-table td{padding:9px 13px;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--text2);text-align:right;white-space:nowrap;}
.corte-table td:first-child{text-align:left;font-family:var(--sans);font-weight:700;font-size:13px;color:var(--text);}
.corte-table td.date-cell{font-weight:700;color:var(--text);font-family:var(--sans);font-size:12px;}

/* PILLS */
.pill{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10.5px;font-weight:600;font-family:var(--mono);white-space:nowrap;}
.pill.bcp{background:var(--bcp-pale);color:var(--bcp);}
.pill.yape{background:var(--yape-pale);color:var(--yape);}
.pill.pre{background:var(--pre-pale);color:var(--pre);}
.pill.trad{background:var(--trad-pale);color:var(--trad);}
.pill.win{background:var(--green-bg);color:var(--green);}
.pill.loss{background:var(--red-bg);color:var(--red);}
.pill.tie{background:var(--amber-bg);color:var(--amber);}
.pill.na{background:var(--surface3);color:var(--text3);}

/* ══════════════════════════════════
   SEGUIMIENTO PAGE
══════════════════════════════════ */
.seg-page{display:flex;height:calc(100vh - 105px);overflow:hidden;}
@media(max-width:900px){.seg-page{height:auto;min-height:calc(100vh - 105px);}}

/* NAV */
.left-panel{width:258px;min-width:258px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:14px 0;flex-shrink:0;transition:transform .25s ease;}
.left-panel::-webkit-scrollbar{width:3px;}
.left-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.nav-label{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:2px;color:var(--text4);text-transform:uppercase;padding:0 15px 9px;}
.tramo-tree{padding:0 5px;}
.tramo-item{margin-bottom:2px;}
.t-btn{width:100%;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;background:transparent;border:none;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--text2);text-align:left;transition:all .13s;}
.t-btn:hover{background:var(--surface2);}
.t-btn.active-bcp{background:var(--bcp-pale);color:var(--bcp);}
.t-btn.active-yape{background:var(--yape-pale);color:var(--yape);}
.t-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:var(--mono);font-weight:600;flex-shrink:0;background:var(--surface3);color:var(--text3);}
.t-btn.active-bcp .t-icon{background:var(--bcp-glow);color:var(--bcp);}
.t-btn.active-yape .t-icon{background:var(--yape-glow);color:var(--yape);}
.t-label{flex:1;line-height:1.2;}
.t-desc{font-size:10px;color:var(--text4);font-weight:400;font-family:var(--mono);display:block;margin-top:1px;}
.chevron{font-size:9px;color:var(--text4);transition:transform .18s;}
.t-btn.expanded .chevron{transform:rotate(90deg);}
.sub-items{display:none;margin-left:13px;padding-left:10px;border-left:2px solid var(--border);margin-top:1px;}
.sub-items.open{display:block;}
.s-btn{width:100%;display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;background:transparent;border:none;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--text3);text-align:left;transition:all .11s;margin-bottom:1px;}
.s-btn:hover{background:var(--surface2);color:var(--text2);}
.s-btn.active-bcp{background:var(--bcp-pale);color:var(--bcp);font-weight:600;}
.s-btn.active-yape{background:var(--yape-pale);color:var(--yape);font-weight:600;}
.s-dot{width:4px;height:4px;border-radius:50%;background:currentColor;flex-shrink:0;}
.ss-items{display:none;margin-left:10px;padding-left:8px;border-left:1px dashed var(--border2);margin-top:1px;}
.ss-items.open{display:block;}
.ss-btn{width:100%;display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:5px;background:transparent;border:none;cursor:pointer;font-family:var(--mono);font-size:10px;color:var(--text4);text-align:left;transition:all .1s;margin-bottom:1px;}
.ss-btn:hover{background:var(--surface2);color:var(--text2);}
.ss-btn.active-bcp{background:var(--bcp-pale);color:var(--bcp);}
.sss-items{display:none;margin-left:10px;padding-left:8px;border-left:1px dotted var(--border2);margin-top:1px;}
.sss-items.open{display:block;}
.sss-btn{width:100%;display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:4px;background:transparent;border:none;cursor:pointer;font-family:var(--mono);font-size:9.5px;color:var(--text4);text-align:left;transition:all .1s;margin-bottom:1px;}
.sss-btn:hover{background:var(--surface2);color:var(--text2);}
.sss-btn.active-bcp{background:var(--bcp-pale);color:var(--bcp);}
.divider{height:1px;background:var(--border);margin:8px 11px;}
.group-badge{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text4);padding:2px 13px 6px;}

/* ENTITY TABS inside seg page */
.ent-bar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);}
.ent-tab{padding:7px 16px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--text3);transition:all .16s;}
.ent-tab.bcp.active{color:var(--bcp);border-color:var(--bcp);background:var(--bcp-pale);}
.ent-tab.yape.active{color:var(--yape);border-color:var(--yape);background:var(--yape-pale);}
.ent-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;background:currentColor;}

/* HAMBURGER */
.hamburger{display:none;flex-direction:column;gap:4px;padding:6px;background:none;border:none;cursor:pointer;border-radius:6px;}
.hamburger span{display:block;width:20px;height:2px;background:var(--text2);border-radius:2px;transition:all .2s;}
.hamburger.open span:nth-child(1){transform:translateY(6px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;opacity:0;transition:opacity .25s;}
.drawer-overlay.open{display:block;opacity:1;}

/* RIGHT PANEL */
.right-panel{flex:1;overflow-y:auto;padding:20px;background:var(--bg);min-width:0;}
.right-panel::-webkit-scrollbar{width:3px;}
.right-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* BREADCRUMB */
.bc{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--text4);margin-bottom:14px;flex-wrap:wrap;}
.bc-sep{color:var(--border2);}
.bc-cur{color:var(--text2);font-weight:600;}

/* SECTION HEADER */
.sec-hdr{display:flex;align-items:flex-end;gap:12px;margin-bottom:14px;}
.sec-title{font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1;}
.sec-title.bcp{color:var(--bcp);}
.sec-title.yape{color:var(--yape);}
.sec-sub{font-family:var(--mono);font-size:11px;color:var(--text3);padding-bottom:3px;}

/* BANNERS */
.wl-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:9px;margin-bottom:14px;font-size:12px;font-weight:600;border:1.5px solid;}
.wl-banner.win{background:var(--green-bg);border-color:rgba(21,128,61,.28);color:var(--green);}
.wl-banner.loss{background:var(--red-bg);border-color:rgba(185,28,28,.28);color:var(--red);}
.wl-banner.tie{background:var(--amber-bg);border-color:rgba(180,83,9,.28);color:var(--amber);}
.wl-banner.nodig{background:var(--amber-bg);border-color:rgba(180,83,9,.28);color:var(--amber);}
.wl-icon{font-size:15px;flex-shrink:0;}
.wl-text{flex:1;line-height:1.3;}
.wl-diff{font-family:var(--mono);font-size:12px;font-weight:700;padding:2px 9px;border-radius:6px;background:rgba(255,255,255,.65);white-space:nowrap;}
.no-pre{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:8px;background:var(--amber-bg);border:1px solid rgba(180,83,9,.22);color:var(--amber);font-family:var(--mono);font-size:11px;margin-bottom:14px;}

/* KPI DONUTS */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 12px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;}
.kpi-card-title{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--text3);margin-bottom:10px;text-align:center;}
.donut-wrap{position:relative;width:110px;height:110px;margin:0 auto;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.donut-val{font-size:14px;font-weight:800;color:var(--text);letter-spacing:-.5px;line-height:1;}
.donut-sub{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:2px;}
.kpi-leg{display:flex;flex-direction:column;gap:4px;margin-top:10px;width:100%;}
.leg-row{display:flex;align-items:center;justify-content:space-between;gap:4px;}
.leg-left{display:flex;align-items:center;gap:5px;min-width:0;}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.leg-lbl{font-family:var(--mono);font-size:9.5px;color:var(--text3);}
.leg-val{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--text2);}
.leg-pct{font-family:var(--mono);font-size:9px;color:var(--text4);}

/* CHARTS */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--shadow);min-width:0;}
.chart-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px;}
.chart-sub{font-family:var(--mono);font-size:9.5px;color:var(--text3);margin-bottom:12px;}
canvas{display:block;width:100%!important;}

/* TABLE */
.tbl-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px;}
.tbl-hdr{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface2);}
.tbl-title{font-size:13px;font-weight:700;color:var(--text);flex:1;}
.tbl-badge{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:4px;border:1px solid var(--border2);color:var(--text3);}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;min-width:600px;}
thead tr{background:var(--surface2);}
th{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--text3);padding:8px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);}
th:first-child{text-align:left;}
th.th-dig{color:var(--bcp);}th.th-pre{color:var(--pre);}th.th-trad{color:var(--trad);}
tbody tr{border-top:1px solid var(--border);transition:background .09s;}
tbody tr.cl{cursor:pointer;}tbody tr.cl:hover{background:var(--surface2);}
tbody tr.rs td:first-child{padding-left:24px;font-size:12px;font-family:var(--mono);font-weight:500;color:var(--text2);}
td{padding:9px 11px;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--text2);text-align:right;white-space:nowrap;}
td:first-child{text-align:left;color:var(--text);font-weight:700;font-family:var(--sans);font-size:13px;}
.gap-cell{text-align:center!important;}
.na-c{color:var(--text4)!important;}

/* NO DATA */
.no-data{padding:36px 20px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--text3);}
.no-data span{display:block;font-size:22px;margin-bottom:8px;}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.an{animation:fadeUp .24s ease both;}
.an1{animation-delay:.04s;}.an2{animation-delay:.08s;}.an3{animation-delay:.13s;}.an4{animation-delay:.18s;}

/* RESPONSIVE */
/* ── TABLET ── */
@media(max-width:900px){
  .hamburger{display:flex;}

  .trend-grid{grid-template-columns:1fr;}
  .charts-row{grid-template-columns:1fr;}
}

/* ── MOBILE ── */
@media(max-width:600px){
  /* Header */
  .hdr{padding:10px 12px;}
  .hdr-title{font-size:13px;}
  .hdr-badges .badge:first-child{display:none;}

  /* Main tabs */
  .main-tabs{padding:0 10px;top:53px;}

  /* Indicadores page */

  .ind-entity-bar{gap:6px;}
  .ind-ent-btn{padding:6px 12px;font-size:12px;}
  .ind-label{display:none;}
  .ind-section-title{font-size:17px;}
  .ind-section-sub{font-size:10px;}

  /* Delta cards — 1 column on very small, 2 col on mid mobile */
  .delta-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .delta-card{padding:12px 10px 10px;}
  .delta-val{font-size:17px;}
  .delta-label{font-size:9px;}
  .delta-vs{font-size:9px;}

  /* Trend charts — always 1 col */
  .trend-grid{grid-template-columns:1fr !important;}
  .charts-row{grid-template-columns:1fr !important;}

  /* Inline grids used in general view */
  [style*="grid-template-columns:1fr 1fr"]{
    display:flex !important;
    flex-direction:column !important;
    gap:10px !important;
  }

  /* Seguimiento right panel */
  .right-panel{padding:12px 10px;}
  .sec-title{font-size:18px;}
  .sec-sub{font-size:10px;}

  /* KPI donuts — stack 2 cols */
  .kpi-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .kpi-card{padding:10px 8px 8px;}
  .kpi-card-title{font-size:8.5px;}
  .donut-wrap{width:90px;height:90px;}
  .donut-val{font-size:12px;}

  /* WL banners */
  .wl-banner{flex-wrap:wrap;gap:6px;padding:9px 11px;}
  .wl-diff{font-size:11px;}

  /* Entity tabs in seguimiento */
  .ent-bar{padding:8px 10px;}
  .ent-tab{padding:6px 12px;font-size:12px;}

  /* Tables — ensure horizontal scroll */
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  table{min-width:540px;}
  .corte-table{min-width:600px;}

  /* Nav label */
  .nav-label{font-size:9px;}

  /* No-pre note */
  .no-pre{font-size:10px;padding:7px 11px;}
}

//  FORMAT
// ═══════════════════════════════════════════════════════════════════
const fmt={
  num:v=>v==null?'—':Math.round(v).toLocaleString('es-PE'),
  pct:v=>v==null?'—':(v*100).toFixed(1)+'%',
  mm: v=>v==null?'—':v<0.1&&v>0?'S/ '+(v*1000).toFixed(1)+' K':v<1000?'S/ '+v.toFixed(2)+' MM':'S/ '+(v/1000).toFixed(1)+' B',
  mmS:v=>v==null?'—':v<0.1&&v>0?'S/'+(v*1000).toFixed(1)+'K':v<1000?'S/'+v.toFixed(1):'S/'+(v/1000).toFixed(1)+'B',
};
const isZ=v=>v==null||v===0;
function deltaArrow(cur,prev,higher_is_good=true){
  if(prev==null||prev===0)return{sym:'—',cls:'flat'};
  const pct=((cur-prev)/Math.abs(prev)*100);
  const up=pct>0;
  const good=higher_is_good?up:!up;
  return{sym:(up?'▲':'▼')+' '+Math.abs(pct).toFixed(1)+'%', cls:good?'up':'down'};
}

// ═══════════════════════════════════════════════════════════════════
//  WIN/LOSS
// ═══════════════════════════════════════════════════════════════════
function wlCalc(dig,trad){if(dig==null||trad==null||isZ(dig)||isZ(trad))return null;return+((dig-trad)*100).toFixed(2);}
function wlPill(dig,trad,noDig){
  if(noDig)return'<span class="pill na">Sin part. Dig.</span>';
  const v=wlCalc(dig,trad);if(v==null)return'<span class="pill na">N/D</span>';
  const s=v>0?'+':'';
  if(v>0.05)return`<span class="pill win">▲ ${s}${v.toFixed(1)} pp</span>`;
  if(v<-0.05)return`<span class="pill loss">▼ ${v.toFixed(1)} pp</span>`;
  return'<span class="pill tie">= 0 pp</span>';
}
function wlBanner(dig,trad,label,noDig){
  if(noDig)return`<div class="wl-banner nodig an an1"><span class="wl-icon">🚫</span><span class="wl-text">Digital <strong>no participa</strong> en <strong>${label||'este segmento'}</strong></span></div>`;
  const v=wlCalc(dig,trad);if(v==null)return'';
  const s=v>0?'+':'',w=label?`<strong>${label}</strong> ·`:'·';
  if(v>0.05)return`<div class="wl-banner win an an1"><span class="wl-icon">✅</span><span class="wl-text">Digital gana ${w} efectividad vs Tradicional</span><span class="wl-diff">${s}${v.toFixed(1)} pp</span></div>`;
  if(v<-0.05)return`<div class="wl-banner loss an an1"><span class="wl-icon">⚠️</span><span class="wl-text">Digital pierde ${w} efectividad vs Tradicional</span><span class="wl-diff">${v.toFixed(1)} pp</span></div>`;
  return`<div class="wl-banner tie an an1"><span class="wl-icon">➖</span><span class="wl-text">Digital empata ${w} vs Tradicional</span><span class="wl-diff">0 pp</span></div>`;
}
function noPre(){return`<div class="no-pre an an1"><span>ℹ️</span>Sin participación de Pre-gestión en este tramo</div>`;}

      <td>${fmt.mm(v.rec_trad)}</td>
    </tr>`).join('');

  document.getElementById('ind-content').innerHTML=`
    <div class="ind-section-title" style="color:#374151;">📊 Vista General Consolidada</div>
    <div class="ind-section-sub">BCP Activa + BCP +120 + Yape · Corte 20/05/2026 · Toca una fila para hacer zoom</div>
    ${deltaHtml}
    <div class="trend-grid an an2">
      <div class="trend-card" style="grid-column:1/2;">
        <div class="trend-title">Clientes Totales · Pre-gestión · Digital · Tradicional</div>
        <div class="trend-sub">Consolidado BCP Activa + BCP +120 + Yape · Por canal · 3 cortes</div>
        <canvas id="genCli" height="150"></canvas>
      </div>
      <div class="trend-card" style="grid-column:2/3;">
        <div class="trend-title">Clientes por Tramo · Digital vs Tradicional</div>

        <canvas id="genTramo" height="150"></canvas>
      </div>
    </div>
    <div class="trend-grid an an3">
      <div class="trend-card">
        <div class="trend-title">Deuda Vencida · Digital vs Tradicional</div>
        <div class="trend-sub">BCP Activa · Yape · S/ MM · 3 cortes</div>
        <canvas id="genDV" height="150"></canvas>
      </div>

        <div class="trend-title">Recupero · Digital vs Tradicional</div>

        <canvas id="genRec" height="150"></canvas>

      <div class="corte-table-hdr"><div class="corte-table-title">Desglose por Entidad · Corte 20/05 · Toca fila → zoom</div></div>
      <div class="corte-scroll"><table class="corte-table">
        <thead><tr>
          <th>Entidad</th>
          <th class="th-pre">Cli Pre</th><th class="th-dig">Cli Dig</th><th>Cli Trad</th>
          <th class="th-dig">Part. Dig</th><th class="th-pre">Part. Pre</th><th>Part. Trad</th>
          <th class="th-dig">DV Dig</th><th>DV Trad</th>
          <th class="th-dig">Rec Dig</th><th>Rec Trad</th>
        </tr></thead>
        <tbody>${entityRows}</tbody>
      </table></div>
    </div>`;

  destroyCharts();
  requestAnimationFrame(()=>{
    const baseOpts={responsive:true,maintainAspectRatio:true,aspectRatio:2.1,plugins:{legend:{position:'bottom',labels:{font:{family:CF,size:11,weight:'600'},color:'#374151',boxWidth:10,boxHeight:2,padding:12,usePointStyle:true}},tooltip:{backgroundColor:'#fff',titleColor:'#111827',bodyColor:'#374151',borderColor:'#e2e7ef',borderWidth:1,padding:9,titleFont:{family:CF,size:12,weight:'700'},bodyFont:{family:'JetBrains Mono',size:11}}},scales:{x:{grid:{display:false},ticks:{font:{family:CF,size:11,weight:'600'},color:'#374151'}},y:{grid:{color:'#f0f2f5'},ticks:{font:{family:'JetBrains Mono',size:10},color:'#6b7280'},border:{dash:[4,4]}}}};
    const numFmt=v=>v>=1000?(v/1000).toFixed(0)+'K':v;
    const stackedOpts={...baseOpts,scales:{...baseOpts.scales,x:{...baseOpts.scales.x,stacked:true},y:{...baseOpts.scales.y,stacked:true,ticks:{...baseOpts.scales.y.ticks,callback:numFmt}}}};

    // ── CHART 1: Clientes apilado Pre/Dig/Trad · 3 cortes ──
    new Chart(document.getElementById('genCli').getContext('2d'),{type:'bar',
      data:{labels:dates,datasets:[
        {label:'Pre-gestión',data:consolidated.map(d=>Math.round(d.cli_pre)), backgroundColor:'#7c3aed',stack:'s',borderSkipped:false,borderRadius:0},
        {label:'Digital',    data:consolidated.map(d=>Math.round(d.cli_dig)),  backgroundColor:'#1a5fd4',stack:'s',borderSkipped:false,borderRadius:0},
        {label:'Tradicional',data:consolidated.map(d=>Math.round(d.cli_trad)), backgroundColor:'rgba(100,116,139,.5)',stack:'s',borderSkipped:false,borderRadius:4},
      ]},
      options:stackedOpts});

    // ── CHART 2: Clientes por tramo BCP Activa · Pre/Dig/Trad ──
    // Datos del corte 20/05 desde BCP seguimiento
    const tramos=['1–30','31–60','61–90','91–120','+120'];
    const tramoKeys=['t130','t3160','t6190','t91120','t121'];
    // Pre-gestión por tramo viene de IND.bcp último corte estructurado por tramo
    // Usamos BCP seguimiento para dig/trad, IND para pre aproximado por tramo

    const digPorTramo=tramoKeys.map(k=>BCP[k]?Math.round(BCP[k].cd||0):0);
    const tradPorTramo=tramoKeys.map(k=>BCP[k]?Math.round(BCP[k].ct||0):0);
    new Chart(document.getElementById('genTramo').getContext('2d'),{type:'bar',
      data:{labels:tramos,datasets:[
        {label:'Pre-gestión',data:prePorTramo, backgroundColor:'#7c3aed',stack:'s',borderSkipped:false,borderRadius:0},
        {label:'Digital',    data:digPorTramo,  backgroundColor:'#1a5fd4',stack:'s',borderSkipped:false,borderRadius:0},
        {label:'Tradicional',data:tradPorTramo, backgroundColor:'rgba(100,116,139,.5)',stack:'s',borderSkipped:false,borderRadius:4},
      ]},
      options:{...stackedOpts,plugins:{...stackedOpts.plugins,tooltip:{...stackedOpts.plugins.tooltip,callbacks:{label:c=>` ${c.dataset.label}: ${numFmt(c.parsed.y)}`}}}}});

    // ── CHART 3: DV Dig vs Trad ──
    new Chart(document.getElementById('genDV').getContext('2d'),{type:'line',data:{labels:dates,datasets:[
      {label:'BCP Dig',  data:IND.bcp.map(d=>+d.dv_dig.toFixed(2)),  borderColor:'#1a5fd4',backgroundColor:'rgba(26,95,212,.07)',borderWidth:2.5,fill:true, tension:0.35,pointRadius:4,pointHoverRadius:7},
      {label:'BCP Trad', data:IND.bcp.map(d=>+d.dv_trad.toFixed(2)), borderColor:'#1a5fd4',backgroundColor:'transparent',        borderWidth:1.8,fill:false,tension:0.35,pointRadius:4,pointHoverRadius:7,borderDash:[6,3]},
      {label:'Yape Dig', data:IND.yape.map(d=>+d.dv_dig.toFixed(2)), borderColor:'#e0500a',backgroundColor:'rgba(224,80,10,.07)',borderWidth:2.5,fill:true, tension:0.35,pointRadius:4,pointHoverRadius:7},
    ]},options:{...baseOpts,scales:{...baseOpts.scales,y:{...baseOpts.scales.y,ticks:{...baseOpts.scales.y.ticks,callback:v=>'S/'+v}}}}});

    // ── CHART 4: Recupero Dig vs Trad ──
    new Chart(document.getElementById('genRec').getContext('2d'),{type:'line',data:{labels:dates,datasets:[
      {label:'BCP Dig',  data:IND.bcp.map(d=>+d.rec_dig.toFixed(2)),  borderColor:'#1a5fd4',backgroundColor:'rgba(26,95,212,.07)',borderWidth:2.5,fill:true, tension:0.35,pointRadius:4,pointHoverRadius:7},
      {label:'BCP Trad', data:IND.bcp.map(d=>+d.rec_trad.toFixed(2)), borderColor:'#1a5fd4',backgroundColor:'transparent',        borderWidth:1.8,fill:false,tension:0.35,pointRadius:4,pointHoverRadius:7,borderDash:[6,3]},
      {label:'Yape Dig', data:IND.yape.map(d=>+d.rec_dig.toFixed(2)), borderColor:'#e0500a',backgroundColor:'rgba(224,80,10,.07)',borderWidth:2.5,fill:true, tension:0.35,pointRadius:4,pointHoverRadius:7},
      {label:'Yape Trad',data:IND.yape.map(d=>+d.rec_trad.toFixed(2)),borderColor:'#e0500a',backgroundColor:'transparent',        borderWidth:1.8,fill:false,tension:0.35,pointRadius:4,pointHoverRadius:7,borderDash:[6,3]},
    ]},options:{...baseOpts,scales:{...baseOpts.scales,y:{...baseOpts.scales.y,ticks:{...baseOpts.scales.y.ticks,callback:v=>'S/'+v}}}}});
  });
}

function renderIndicadores(){
  if(indEntity==='general'){renderGeneralInd();return;}
  const e=indEntity;
  const data=IND[e];
  const col=e==='yape'?'#e0500a':e==='b120'?'#7c3aed':'#1a5fd4';
  const colClass=e==='yape'?'yape':e==='b120'?'b120':'bcp';
  const labels={bcp:'BCP Activa',b120:'BCP +120',yape:'Yape'};
  const latest=data[data.length-1];
  const prev=data[data.length-2];
  const dates=data.map(d=>d.date);
  const hasPreData=data.some(d=>d.cli_pre>0);
  const isYapeOrB120=false; // always show trad columns

  // ── DELTA CARDS ──
  const metrics=[
    {key:'cli',label:'Clientes Digitales',
     val:fmt.num(latest.cli_dig),
     sub:`Corte ${latest.date}`,
     delta:deltaArrow(latest.cli_dig,prev.cli_dig,true),
     canals:[
       hasPreData?{l:'Pre-gestión',col:CPRE,v:latest.cli_pre,pct:latest.part_pre}:null,
       {l:'Digital',col:col,v:latest.cli_dig,pct:latest.part_dig},
       !isZ(latest.cli_trad)?{l:'Tradicional',col:'#94a3b8',v:latest.cli_trad,pct:latest.part_trad}:null,
     ].filter(Boolean)},
    {key:'part',label:'Participación Digital',
     val:fmt.pct(latest.part_dig),
     sub:`vs ${fmt.pct(prev.part_dig)} corte anterior`,
     delta:deltaArrow(latest.part_dig,prev.part_dig,true),
     canals:[
       hasPreData?{l:'Pre-gestión',col:CPRE,v:null,pct:latest.part_pre}:null,
       {l:'Digital',col:col,v:null,pct:latest.part_dig},
       !isZ(latest.part_trad)?{l:'Tradicional',col:'#94a3b8',v:null,pct:latest.part_trad}:null,
     ].filter(Boolean)},
    {key:'dv',label:'Deuda Vencida Dig.',
     val:fmt.mm(latest.dv_dig),
     sub:(()=>{
       const tot=latest.dv_dig+(latest.dv_trad||0)+(hasPreData?latest.dv_pre||0:0);
       const pct=tot>0?((latest.dv_dig/tot)*100).toFixed(1):'—';
       return `Total: <strong>${fmt.mm(tot)}</strong> · <span style="color:${col};font-weight:700;">Dig = ${pct}%</span>`;
     })(),
     delta:deltaArrow(latest.dv_dig,prev.dv_dig,false),
     canals:[
       hasPreData&&!isZ(latest.dv_pre)?{l:'Pre-gestión',col:CPRE,v:latest.dv_pre,pct:null}:null,
       {l:'Digital',col:col,v:latest.dv_dig,pct:null},
       !isZ(latest.dv_trad)?{l:'Tradicional',col:'#94a3b8',v:latest.dv_trad,pct:null}:null,
     ].filter(Boolean)},
    {key:'rec',label:'Recupero Digital',
     val:fmt.mm(latest.rec_dig),
     sub:(()=>{
       const tot=latest.rec_dig+(latest.rec_trad||0)+(hasPreData?latest.rec_pre||0:0);
       const pct=tot>0?((latest.rec_dig/tot)*100).toFixed(1):'—';
       return `Total: <strong>${fmt.mm(tot)}</strong> · <span style="color:${col};font-weight:700;">Dig = ${pct}%</span>`;
     })(),
     delta:deltaArrow(latest.rec_dig,prev.rec_dig,true),
     canals:[
       hasPreData&&!isZ(latest.rec_pre)?{l:'Pre-gestión',col:CPRE,v:latest.rec_pre,pct:null}:null,
       {l:'Digital',col:col,v:latest.rec_dig,pct:null},
       !isZ(latest.rec_trad)?{l:'Tradicional',col:'#94a3b8',v:latest.rec_trad,pct:null}:null,
     ].filter(Boolean)},
  ];

  const deltaCards=metrics.map(m=>`
    <div class="delta-card ${colClass}">
      <div class="delta-label">${m.label}</div>
      <div class="delta-val">${m.val}</div>
      <div class="delta-sub" style="font-size:10.5px;line-height:1.5;">${m.sub}</div>
      <div class="delta-change">
        <span class="delta-arrow ${m.delta.cls}">${m.delta.sym}</span>
        <span class="delta-vs">vs corte anterior</span>
      </div>
      <div class="canal-mini">
        ${m.canals.map(c=>`<div class="canal-mini-row">
          <div class="canal-mini-label"><span class="canal-mini-dot" style="background:${c.col}"></span>${c.l}</div>
          <div style="display:flex;gap:6px;align-items:center;">
            ${c.v!=null?`<span class="canal-mini-val">${m.key==='dv'||m.key==='rec'?fmt.mmS(c.v):fmt.num(c.v)}</span>`:''}
            ${c.pct!=null?`<span class="canal-mini-pct">${fmt.pct(c.pct)}</span>`:''}
          </div>
        </div>`).join('')}
      </div>
    </div>`).join('');

  // ── TREND CHARTS HTML ──
  const trendCharts=`
    <div class="trend-grid">
      <div class="trend-card">
        <div class="trend-title">Clientes · Evolución por Corte</div>
        <div class="trend-sub">${labels[e]} · Pre-gestión · Digital${!isYapeOrB120?' · Tradicional':''}</div>
        <canvas id="trendCli" height="150"></canvas>
      </div>
      <div class="trend-card">
        <div class="trend-title">Participación Digital vs Tradicional</div>
        <div class="trend-sub">${labels[e]} · % del total activa</div>
        <canvas id="trendPart" height="150"></canvas>
      </div>
      <div class="trend-card">
        <div class="trend-title">Deuda Vencida · S/ MM</div>
        <div class="trend-sub">${labels[e]} · Canal Digital acumulado</div>
        <canvas id="trendDv" height="150"></canvas>
      </div>
      <div class="trend-card">
        <div class="trend-title">Recupero · S/ MM</div>
        <div class="trend-sub">${labels[e]} · Canal Digital acumulado</div>
        <canvas id="trendRec" height="150"></canvas>
      </div>
    </div>`;

  // ── CORTE TABLE ──
  const tableRows=data.map(d=>{
    const tradCols=isYapeOrB120?'':`<td>${fmt.num(d.cli_trad)}</td><td class="${e==='b120'?'':''}"><span class="pill trad">${fmt.pct(d.part_trad)}</span></td><td>${fmt.mm(d.dv_trad)}</td><td>${fmt.mm(d.rec_trad)}</td>`;
    const preCols=hasPreData?`<td>${fmt.num(d.cli_pre)}</td><td>${fmt.pct(d.part_pre)}</td><td>${fmt.mm(d.dv_pre)}</td><td>${fmt.mm(d.rec_pre)}</td>`:'';
    return`<tr>
      <td class="date-cell">${d.label}</td>
      ${preCols}
      <td><span class="pill ${colClass}">${fmt.num(d.cli_dig)}</span></td>
      <td><span class="pill ${colClass}">${fmt.pct(d.part_dig)}</span></td>
      <td>${fmt.mm(d.dv_dig)}</td>
      <td>${fmt.mm(d.rec_dig)}</td>
      ${tradCols}
    </tr>`;
  }).join('');

  const preHeads=hasPreData?`<th class="th-pre">Cli Pre</th><th class="th-pre">Part. Pre</th><th class="th-pre">DV Pre</th><th class="th-pre">Rec. Pre</th>`:'';
  const tradHeads=isYapeOrB120?'':`<th class="th-trad">Cli Trad</th><th class="th-trad">Part. Trad</th><th class="th-trad">DV Trad</th><th class="th-trad">Rec. Trad</th>`;

  document.getElementById('ind-content').innerHTML=`
    <div class="ind-section-title" style="color:${col}">${labels[e]}</div>
    <div class="ind-section-sub">Evolución mensual · 3 cortes de Mayo 2026 · Digital vs Tradicional${hasPreData?' · Pre-gestión':''}</div>
    <div class="delta-grid an">${deltaCards}</div>
    ${trendCharts}
    <div class="corte-table-wrap an">
      <div class="corte-table-hdr">
        <div class="corte-table-title">Resumen por Corte · ${labels[e]}</div>
      </div>
      <div class="corte-scroll">
        <table class="corte-table">
          <thead><tr>
            <th>Corte</th>
            ${preHeads}
            <th class="th-dig">Cli Dig</th><th class="th-dig">Part. Dig</th><th class="th-dig">DV Dig</th><th class="th-dig">Rec. Dig</th>
            ${tradHeads}
          </tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>`;

  // ── RENDER CHARTS ──
  destroyCharts();
  requestAnimationFrame(()=>{
    const baseOpts={responsive:true,maintainAspectRatio:true,aspectRatio:2.2,plugins:{legend:{position:'bottom',labels:{font:{family:CF,size:11,weight:'600'},color:'#374151',boxWidth:10,boxHeight:2,padding:12,usePointStyle:true}},tooltip:{backgroundColor:'#fff',titleColor:'#111827',bodyColor:'#374151',borderColor:'#e2e7ef',borderWidth:1,padding:9,titleFont:{family:CF,size:12,weight:'700'},bodyFont:{family:'JetBrains Mono',size:11}}},scales:{x:{grid:{display:false},ticks:{font:{family:CF,size:11,weight:'600'},color:'#374151'}},y:{grid:{color:'#f0f2f5'},ticks:{font:{family:'JetBrains Mono',size:10},color:'#6b7280'},border:{dash:[4,4]}}}};

    // CLI chart — bars by canal
    const cliDs=[];
    if(hasPreData)cliDs.push({label:'Pre-gestión',data:data.map(d=>d.cli_pre),backgroundColor:CPRE,borderRadius:5,borderSkipped:false});
    cliDs.push({label:'Digital',data:data.map(d=>d.cli_dig),backgroundColor:col,borderRadius:5,borderSkipped:false});
    if(!isYapeOrB120)cliDs.push({label:'Tradicional',data:data.map(d=>d.cli_trad),backgroundColor:CTRAD,borderRadius:5,borderSkipped:false,borderColor:'#94a3b8',borderWidth:1.5});
    const c1=new Chart(document.getElementById('trendCli').getContext('2d'),{type:'bar',data:{labels:dates,datasets:cliDs},options:{...baseOpts,scales:{...baseOpts.scales,y:{...baseOpts.scales.y,ticks:{...baseOpts.scales.y.ticks,callback:v=>v>=1000?(v/1000).toFixed(0)+'K':v}}}}});
    chartInstances.push(c1);

    // PARTICIPACION — line stacked area
    const partDs=[];
    if(hasPreData)partDs.push({label:'Pre-gestión',data:data.map(d=>+(d.part_pre*100).toFixed(1)),borderColor:CPRE,backgroundColor:'rgba(124,58,237,.08)',borderWidth:2,fill:false,tension:0.35,pointRadius:4,pointHoverRadius:7});
    partDs.push({label:'Digital',data:data.map(d=>+(d.part_dig*100).toFixed(1)),borderColor:col,backgroundColor:col.replace(')',',0.08)').replace('rgb','rgba'),borderWidth:2.5,fill:true,tension:0.35,pointRadius:4,pointHoverRadius:7});
    if(!isYapeOrB120)partDs.push({label:'Tradicional',data:data.map(d=>+(d.part_trad*100).toFixed(1)),borderColor:'#94a3b8',backgroundColor:'transparent',borderWidth:2,fill:false,tension:0.35,pointRadius:4,pointHoverRadius:7,borderDash:[6,3]});
    const c2=new Chart(document.getElementById('trendPart').getContext('2d'),{type:'line',data:{labels:dates,datasets:partDs},options:{...baseOpts,scales:{...baseOpts.scales,y:{...baseOpts.scales.y,ticks:{...baseOpts.scales.y.ticks,callback:v=>v+'%'},max:100}}}});
    chartInstances.push(c2);

    // DV chart — lines
    const dvDs=[];
    if(hasPreData&&data.some(d=>d.dv_pre>0))dvDs.push({label:'Pre-gestión',data:data.map(d=>+d.dv_pre.toFixed(2)),borderColor:CPRE,backgroundColor:'transparent',borderWidth:2,fill:false,tension:0.35,pointRadius:4,pointHoverRadius:7,borderDash:[4,3]});
    dvDs.push({label:'Digital',data:data.map(d=>+d.dv_dig.toFixed(2)),borderColor:col,backgroundColor:col.replace(')',',0.07)').replace('rgb','rgba'),borderWidth:2.5,fill:true,tension:0.35,pointRadius:4,pointHoverRadius:7});
    if(!isYapeOrB120&&data.some(d=>d.dv_trad>0&&d.dv_trad<5000))dvDs.push({label:'Tradicional',data:data.map(d=>+d.dv_trad.toFixed(2)),borderColor:'#94a3b8',backgroundColor:'transparent',borderWidth:2,fill:false,tension:0.35,pointRadius:4,pointHoverRadius:7,borderDash:[6,3]});
    const c3=new Chart(document.getElementById('trendDv').getContext('2d'),{type:'line',data:{labels:dates,datasets:dvDs},options:{...baseOpts,scales:{...baseOpts.scales,y:{...baseOpts.scales.y,ticks:{...baseOpts.scales.y.ticks,callback:v=>'S/'+v}}}}});
    chartInstances.push(c3);

    // RECUPERO chart
    const recDs=[];
    if(hasPreData&&data.some(d=>d.rec_pre>0))recDs.push({label:'Pre-gestión',data:data.map(d=>+d.rec_pre.toFixed(2)),borderColor:CPRE,backgroundColor:'transparent',borderWidth:2,fill:false,tension:0.35,pointRadius:4,pointHoverRadius:7,borderDash:[4,3]});
    recDs.push({label:'Digital',data:data.map(d=>+d.rec_dig.toFixed(2)),borderColor:col,backgroundColor:col.replace(')',',0.07)').replace('rgb','rgba'),borderWidth:2.5,fill:true,tension:0.35,pointRadius:4,pointHoverRadius:7});
    if(!isYapeOrB120&&data.some(d=>d.rec_trad>0))recDs.push({label:'Tradicional',data:data.map(d=>+d.rec_trad.toFixed(2)),borderColor:'#94a3b8',backgroundColor:'transparent',borderWidth:2,fill:false,tension:0.35,pointRadius:4,pointHoverRadius:7,borderDash:[6,3]});
    const c4=new Chart(document.getElementById('trendRec').getContext('2d'),{type:'line',data:{labels:dates,datasets:recDs},options:{...baseOpts,scales:{...baseOpts.scales,y:{...baseOpts.scales.y,ticks:{...baseOpts.scales.y.ticks,callback:v=>'S/'+v}}}}});
    chartInstances.push(c4);
  });
}

function setEntity(e){
  segEntity=e;
  document.getElementById('tab-bcp').className='ent-tab bcp'+(e==='bcp'?' active':'');
  document.getElementById('tab-yape').className='ent-tab yape'+(e==='yape'?' active':'');
  ['plus120-group','nav-plus120-item'].forEach(id=>{
    document.getElementById(id).style.display=e==='yape'?'none':'';
  });
  if(e==='yape'&&(currentView.startsWith('t121')||currentView.startsWith('py')||currentView.startsWith('seg'))){
    navigate('total');
  } else navigate(currentView);
}

function toggleDrawer(){const p=document.getElementById('leftPanel'),o=document.getElementById('drawerOverlay'),h=document.getElementById('hamburger'),open=!p.classList.contains('open');[p,o,h].forEach(el=>el.classList.toggle('open',open));}
function closeDrawer(){['leftPanel','drawerOverlay','hamburger'].forEach(id=>document.getElementById(id).classList.remove('open'));}
function navAndClose(v){navigate(v);if(window.innerWidth<=900)closeDrawer();}
function clearActive(){document.querySelectorAll('.t-btn,.s-btn,.ss-btn,.sss-btn').forEach(b=>b.classList.remove('active-bcp','active-yape'));}
function toggleT(id){const s=document.getElementById('sub-'+id),b=document.getElementById('nav-'+id);if(!s)return;s.classList.toggle('open');if(b)b.classList.toggle('expanded',s.classList.contains('open'));}
function toggleSub(id){const s=document.getElementById('sub-'+id);if(s)s.classList.toggle('open');}
function toggleSS(id){const s=document.getElementById('sub-'+id);if(s)s.classList.toggle('open');}
function destroyCharts(){chartInstances.forEach(c=>c.destroy());chartInstances=[];}
function navigate(view){
  currentView=view;clearActive();destroyCharts();
  const el=document.getElementById('nav-'+view);if(el)el.classList.add('active-'+segEntity);
  document.getElementById('rightPanel').scrollTop=0;
  renderView(view);
}

// KPI DONUTS
function kpiSection(d,hasPre,isYape){
  const col={pre:CPRE,dig:entColor(segEntity),trad:'#94a3b8'};
  const metrics=[
    {id:'dc',title:'Clientes',k:'cd',kt:'ct',kp:null,fmt:v=>Math.round(v).toLocaleString('es-PE'),tot:d.cd+(d.ct||0)},
    {id:'dd',title:'Deuda Vencida',k:'dvd',kt:'dvt',kp:'dvp',fmt:v=>'S/'+v.toFixed(1),tot:(d.dvd||0)+(d.dvt||0)+(hasPre?d.dvp||0:0)},
    {id:'dr',title:'Recupero',k:'rd',kt:'rt',kp:'rp',fmt:v=>'S/'+v.toFixed(1),tot:(d.rd||0)+(d.rt||0)+(hasPre?d.rp||0:0)},
  ];
  const donutCards=metrics.map(m=>{
    const vals=[];
    if(!isZ(d[m.k]))vals.push({l:'Dig',col:col.dig,v:d[m.k]});
    if(!isYape&&!isZ(d[m.kt]))vals.push({l:'Trad',col:col.trad,v:d[m.kt]});
    const tot=vals.reduce((s,x)=>s+x.v,0);
    const legs=vals.map(x=>`<div class="leg-row"><div class="leg-left"><span class="leg-dot" style="background:${x.col}"></span><span class="leg-lbl">${x.l}</span></div><span class="leg-val">${m.fmt(x.v)}</span><span class="leg-pct">${tot>0?(x.v/tot*100).toFixed(0)+'%':''}</span></div>`).join('');
    return`<div class="kpi-card an an2"><div class="kpi-card-title">${m.title}</div><div class="donut-wrap"><canvas id="${m.id}" width="110" height="110"></canvas><div class="donut-center"><div class="donut-val">${m.fmt(m.tot)}</div><div class="donut-sub">Total</div></div></div><div class="kpi-leg">${legs}</div></div>`;
  }).join('');
  const efSrc=[];
  if(hasPre&&!isZ(d.ep))efSrc.push({l:'Pre',col:col.pre,v:d.ep});
  if(!isZ(d.ed))efSrc.push({l:'Digital',col:col.dig,v:d.ed});
  if(!isZ(d.et))efSrc.push({l:isYape?'Ref.Trad':'Tradicional',col:col.trad,v:d.et});
  const efLegs=efSrc.map(x=>`<div class="leg-row"><div class="leg-left"><span class="leg-dot" style="background:${x.col}"></span><span class="leg-lbl">${x.l}</span></div><span class="leg-val">${fmt.pct(x.v)}</span></div>`).join('');
  const efCard=`<div class="kpi-card an an2"><div class="kpi-card-title">Efectividad</div><canvas id="def" height="110" style="max-height:110px;"></canvas><div class="kpi-leg" style="margin-top:8px;">${efLegs}<div style="margin-top:5px;padding-top:5px;border-top:1px solid var(--border);">${wlPill(d.ed,d.et,false)}</div></div></div>`;
  return`<div class="kpi-grid an an2">${donutCards}${efCard}</div>`;
}

function renderDonuts(d,hasPre,isYape){
  const col={pre:CPRE,dig:entColor(segEntity),trad:'#94a3b8'};
  [['dc','cd','ct'],['dd','dvd','dvt'],['dr','rd','rt']].forEach(([id,kd,kt])=>{
    const vals=[];
    if(!isZ(d[kd]))vals.push({v:d[kd],c:col.dig});
    if(!isYape&&!isZ(d[kt]))vals.push({v:d[kt],c:col.trad});
    if(!vals.length)return;
    const ctx=document.getElementById(id)?.getContext('2d');if(!ctx)return;
    const c=new Chart(ctx,{type:'doughnut',data:{datasets:[{data:vals.map(x=>x.v),backgroundColor:vals.map(x=>x.c),borderWidth:2,borderColor:'#fff',hoverOffset:4}]},options:{cutout:'68%',responsive:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',titleColor:'#111',bodyColor:'#374',borderColor:'#e2e7ef',borderWidth:1,padding:8,bodyFont:{family:'JetBrains Mono',size:10}}}}});
    chartInstances.push(c);
  });
  const efSrc=[];
  if(hasPre&&!isZ(d.ep))efSrc.push({l:'Pre',col:col.pre,v:d.ep});
  if(!isZ(d.ed))efSrc.push({l:'Digital',col:col.dig,v:d.ed});
  if(!isZ(d.et))efSrc.push({l:isYape?'Ref.Trad':'Tradicional',col:col.trad,v:d.et});
  if(!efSrc.length)return;
  const ctx2=document.getElementById('def')?.getContext('2d');if(!ctx2)return;
  const c2=new Chart(ctx2,{type:'bar',data:{labels:efSrc.map(x=>x.l),datasets:[{data:efSrc.map(x=>+(x.v*100).toFixed(1)),backgroundColor:efSrc.map(x=>x.col),borderRadius:5,borderSkipped:false}]},options:{indexAxis:'y',responsive:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',bodyColor:'#374',borderColor:'#e2e7ef',borderWidth:1,padding:8,bodyFont:{family:'JetBrains Mono',size:11},callbacks:{label:c=>` ${c.parsed.x.toFixed(1)}%`}}},scales:{x:{grid:{color:'#f0f2f5'},ticks:{font:{family:'JetBrains Mono',size:9},color:'#6b7280',callback:v=>v+'%'},border:{dash:[4,4]},max:100},y:{grid:{display:false},ticks:{font:{family:CF,size:9.5,weight:'600'},color:'#374151'}}}}});
  chartInstances.push(c2);
}

function barCliChart(id,labels,datasets){
  const ctx=document.getElementById(id)?.getContext('2d');if(!ctx)return;
  const c=new Chart(ctx,{type:'bar',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:true,aspectRatio:1.9,plugins:{legend:{labels:{font:{family:CF,size:11,weight:'600'},color:'#374151',boxWidth:10,usePointStyle:true,pointStyle:'rect'}},tooltip:{backgroundColor:'#fff',titleColor:'#111827',bodyColor:'#374151',borderColor:'#e2e7ef',borderWidth:1,padding:9,titleFont:{family:CF,size:12,weight:'700'},bodyFont:{family:'JetBrains Mono',size:11},callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y!=null?Math.round(c.parsed.y).toLocaleString('es-PE'):'N/D'}`}}},scales:{x:{grid:{display:false},ticks:{font:{family:CF,size:11,weight:'600'},color:'#374151'}},y:{grid:{color:'#f0f2f5'},ticks:{font:{family:'JetBrains Mono',size:10},color:'#6b7280',callback:v=>v>=1000?(v/1000).toFixed(0)+'K':v},border:{dash:[4,4]}}}}}); chartInstances.push(c);
}

function lineEfChart(id){
  const e=segEntity,isYape=e==='yape';
  const src=isYape?YAPE:BCP;
  const lbls=isYape?['1–30','31–60','61–90','91–120']:['1–30','31–60','61–90','91–120','+120'];
  const keys=isYape?['t130','t3160','t6190','t91120']:['t130','t3160','t6190','t91120','t121'];
  const getEf=(k,c)=>{const r=src[k];if(!r)return null;const v=r[c];return v!=null&&!isZ(v)?+(v*100).toFixed(2):null;};
  const col=entColor(e);
  const datasets=[{label:'Digital',data:keys.map(k=>getEf(k,'ed')),borderColor:col,backgroundColor:col+'14',borderWidth:2.5,pointBackgroundColor:col,pointRadius:4,pointHoverRadius:7,fill:true,tension:0.35}];
  datasets.push({label:isYape?'Ref. Tradicional':'Tradicional',data:keys.map(k=>getEf(k,'et')),borderColor:'#94a3b8',backgroundColor:'transparent',borderWidth:2,pointBackgroundColor:'#94a3b8',pointRadius:4,pointHoverRadius:7,fill:false,tension:0.35,borderDash:[6,3]});
  const ctx=document.getElementById(id)?.getContext('2d');if(!ctx)return;
  const c=new Chart(ctx,{type:'line',data:{labels:lbls,datasets},options:{responsive:true,maintainAspectRatio:true,aspectRatio:1.9,plugins:{legend:{position:'bottom',labels:{font:{family:CF,size:11,weight:'600'},color:'#374151',boxWidth:10,boxHeight:2,padding:14,usePointStyle:true}},tooltip:{backgroundColor:'#fff',titleColor:'#111827',bodyColor:'#374151',borderColor:'#e2e7ef',borderWidth:1,padding:9,titleFont:{family:CF,size:12,weight:'700'},bodyFont:{family:'JetBrains Mono',size:11},callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y!=null?c.parsed.y.toFixed(1)+'%':'N/D'}`}}},scales:{x:{grid:{display:false},ticks:{font:{family:CF,size:11,weight:'600'},color:'#374151'}},y:{grid:{color:'#f0f2f5'},ticks:{font:{family:'JetBrains Mono',size:10},color:'#6b7280',callback:v=>v+'%'},border:{dash:[4,4]}}}}}); chartInstances.push(c);
}

function chartsBlock(barId,barTitle,barSub,lineId){
  return`<div class="charts-row an an3"><div class="chart-card"><div class="chart-title">${barTitle}</div><div class="chart-sub">${barSub}</div><canvas id="${barId}" height="140"></canvas></div><div class="chart-card"><div class="chart-title">Tendencia Efectividad · Dig vs Trad</div><div class="chart-sub">Por tramo de mora · ${segEntity.toUpperCase()} · Corte 20/05</div><canvas id="${lineId}" height="150"></canvas></div></div>`;
}

const TK={'0-1k':'0–1K','1k-5k':'1K–5K','5k-20k':'5K–20K','20k-300k':'20K–300K','300k':'300K+','1k':'1K+'};
function tl(k){return TK[k]||k;}

function tHead(hasPre,isYape){
  const pr=hasPre?`<th class="th-pre">Cli Pre</th><th class="th-pre">Ef. Pre</th>`:`<th colspan="2" style="color:var(--text4);font-size:9px;text-align:center;">Sin Pre</th>`;
  const tr=isYape?'':`<th class="th-trad">Cli Trad</th><th class="th-trad">Ef. Trad</th><th class="gap-cell">Dig vs Trad</th>`;
  return`<thead><tr><th>Nivel</th>${pr}<th class="th-dig">Cli Dig</th><th class="th-dig">Ef. Dig</th>${tr}<th>DV Dig</th><th>Rec Dig</th></tr></thead>`;
}

function tRow(label,d,hasPre,isYape,nav,rc='',noDig){
  if(!d)return'';
  const nd=noDig||!!d.noDig||false;
  const cls=[nav?'cl':'',rc].filter(Boolean).join(' ');
  const click=nav?`onclick="navigate('${nav}')"`:'';
  const pp=hasPre&&d.ep!=null&&!isZ(d.ep)?`<span class="pill pre">${fmt.pct(d.ep)}</span>`:'<span class="na-c">—</span>';
  const pd=nd||isZ(d.ed)?'<span class="na-c">0</span>':`<span class="pill ${segEntity}">${fmt.pct(d.ed)}</span>`;
  const cliPre=hasPre?`<td>${!isZ(d.ep)?fmt.num(d.cd):'<span class="na-c">—</span>'}</td><td>${pp}</td>`:`<td class="na-c">—</td><td class="na-c">—</td>`;
  const cliDig=nd?'<span class="na-c">0</span>':fmt.num(d.cd);
  const tradCols=isYape?'':` <td>${fmt.num(d.ct)}</td><td>${!isZ(d.et)?`<span class="pill trad">${fmt.pct(d.et)}</span>`:'<span class="na-c">—</span>'}</td><td class="gap-cell">${wlPill(nd?null:d.ed,d.et,nd)}</td>`;
  return`<tr class="${cls}" ${click}><td>${label}</td>${cliPre}<td>${cliDig}</td><td>${pd}</td>${tradCols}<td>${nd||isZ(d.dvd)?'<span class="na-c">0</span>':fmt.mm(d.dvd)}</td><td>${nd||isZ(d.rd)?'<span class="na-c">0</span>':fmt.mm(d.rd)}</td></tr>`;
}

const BCM={'total':['Total 1–120'],'t130-res':['Tramo 1–30','Resumen'],'t3160-res':['Tramo 31–60','Resumen'],'t6190-res':['Tramo 61–90','Resumen'],'t91120-res':['Tramo 91–120','Resumen'],'t121-res':['Tramo +120','Resumen'],'t121-0-1k':['Tramo +120','0–1K'],'t121-1k':['Tramo +120','1K+'],'p130-res':['Tramo 1–30','Personas','Resumen'],'py130-res':['Tramo 1–30','Pyme','Resumen'],'p3160-res':['Tramo 31–60','Personas','Resumen'],'py3160-res':['Tramo 31–60','Pyme (solo Trad.)'],'pyD130-res':['Tramo 1–30','Pyme','Seg D']};
function buildBC(v){
  if(BCM[v])return BCM[v];
  let m=v.match(/^(seg|py)([ABCD])130-res$/);if(m)return['Tramo 1–30',m[1]==='py'?'Pyme':'Personas',`Seg ${m[2]}`,'Resumen'];
  m=v.match(/^(seg|py)([ABCD])130-(.+)$/);if(m)return['Tramo 1–30',m[1]==='py'?'Pyme':'Personas',`Seg ${m[2]}`,TK[m[3]]||m[3]];
  m=v.match(/^p3160-(.+)$/);if(m)return['Tramo 31–60','Personas',TK[m[1]]||m[1]];
  return[v];
}
function bcHtml(v){const parts=buildBC(v);return`<div class="bc an">${parts.map((p,i)=>(i?'<span class="bc-sep">›</span>':'')+`<span class="${i===parts.length-1?'bc-cur':''}">${p}</span>`).join('')}</div>`;}

function renderView(v){
  const p=document.getElementById('rightPanel');
  const isYape=segEntity==='yape';
  if(v==='total'){renderTotal(p);return;}
  if(v==='t130-res'){renderTramoRes(p,'t130','Tramo 1–30',true);return;}
  if(v==='t3160-res'){renderTramoRes(p,'t3160','Tramo 31–60',false);return;}
  if(v==='t6190-res'){renderSimple(p,'t6190','Tramo 61–90','Sin zoom',false);return;}
  if(v==='t91120-res'){renderSimple(p,'t91120','Tramo 91–120','Sin zoom',false);return;}
  if(v==='t121-res'&&!isYape){renderSimple(p,'t121','Tramo +120','BCP',false,true);return;}
  if(v==='t121-0-1k'&&!isYape){renderTicketSimple(p,'t121-0-1k','0–1K','Tramo +120');return;}
  if(v==='t121-1k'&&!isYape){renderTicketSimple(p,'t121-1k','1K+','Tramo +120');return;}
  if(v==='p130-res'){renderPortRes(p,'p130','Personas','Tramo 1–30',false);return;}
  if(v==='py130-res'){renderPortRes(p,'py130','Pyme','Tramo 1–30',false);return;}
  if(v==='pyD130-res'){renderSimple(p,'pyD130','Pyme · Seg D','Tramo 1–30',false);return;}
  if(v==='p3160-res'){renderPortRes(p,'p3160','Personas','Tramo 31–60',false);return;}
  if(v==='py3160-res'){renderSimple(p,'py3160','Pyme · Solo Trad.','Tramo 31–60',false,false,true);return;}
  const mSeg=v.match(/^(seg[ABCD])130(-res|-\S+)$/);
  if(mSeg){const sk=mSeg[1]+'130',sf=mSeg[2];if(sf==='-res')renderSegRes(p,sk,`Seg ${mSeg[1][3]}`,'Personas 1–30',false);else renderTicketBCP(p,sk,sf.slice(1),`Seg ${mSeg[1][3]}`,'Personas 1–30',false);return;}
  const mPy=v.match(/^(py[ABC])130(-res|-\S+)$/);
  if(mPy){const sk=mPy[1]+'130',sf=mPy[2];if(sf==='-res')renderSegRes(p,sk,`Seg ${mPy[1][2]}`,'Pyme 1–30',false);else renderTicketBCP(p,sk,sf.slice(1),`Seg ${mPy[1][2]}`,'Pyme 1–30',false);return;}
  const mP3=v.match(/^p3160-(.+)$/);
  if(mP3){renderTicketBCP(p,'p3160',mP3[1],'Personas','Tramo 31–60',false);return;}
  p.innerHTML=bcHtml(v)+'<div class="no-data"><span>🔍</span>Vista no encontrada</div>';
}

function renderTotal(p){
  const isYape=segEntity==='yape',src=isYape?YAPE:BCP,d=src['1-120']||src,hasPre=false;
  const tramos=isYape
    ?[{l:'1–30',k:'t130',n:'t130-res'},{l:'31–60',k:'t3160',n:'t3160-res'},{l:'61–90',k:'t6190',n:'t6190-res'},{l:'91–120',k:'t91120',n:'t91120-res'}]
    :[{l:'1–30',k:'t130',n:'t130-res'},{l:'31–60',k:'t3160',n:'t3160-res'},{l:'61–90',k:'t6190',n:'t6190-res'},{l:'91–120',k:'t91120',n:'t91120-res'},{l:'+120',k:'t121',n:'t121-res'}];
  const tramosSin121=tramos.filter(t=>t.k!=='t121');
  const rows=tramos.map(t=>tRow(t.l,src[t.k]||{},hasPre,isYape,t.n)).join('');
  p.innerHTML=`${bcHtml('total')}<div class="sec-hdr an"><div class="sec-title ${segEntity}">Total 1–120 días</div><div class="sec-sub">${segEntity.toUpperCase()} · Corte 20/05/2026</div></div>${wlBanner(d.ed,d.et,'Total 1–120')}${kpiSection(d,hasPre,isYape)}${chartsBlock('bTot','Clientes por Tramo 1–120','Digital vs Tradicional','lTot')}<div class="tbl-section an an4"><div class="tbl-hdr"><div class="tbl-title">Resumen por Tramo</div><div class="tbl-badge">Toca fila → zoom</div></div><div class="tbl-scroll"><table>${tHead(hasPre,isYape)}<tbody>${rows}</tbody></table></div></div>`;
  requestAnimationFrame(()=>{
    renderDonuts(d,hasPre,isYape);
    const col=entColor(segEntity),lbls=tramosSin121.map(t=>t.l);
    const ds=[{label:'Digital',data:tramosSin121.map(t=>{const r=src[t.k];return r&&!isZ(r.cd)?r.cd:null;}),backgroundColor:col,borderRadius:4,borderSkipped:false},{label:'Tradicional',data:tramosSin121.map(t=>{const r=src[t.k];return r&&!isZ(r.ct)?r.ct:null;}),backgroundColor:CTRAD,borderRadius:4,borderSkipped:false,borderColor:'#94a3b8',borderWidth:1.5}];
    barCliChart('bTot',lbls,ds);lineEfChart('lTot');
  });
}

function renderTramoRes(p,key,title,hasPre){
  const isYape=segEntity==='yape',src=isYape?YAPE:BCP,d=src[key];
  if(!d){p.innerHTML=bcHtml(key+'-res')+'<div class="no-data"><span>🔍</span>Sin datos</div>';return;}
  let subDef=[],subRows='';
  if(isYape&&d.sub){subRows=d.sub.map(s=>`<tr><td style="padding-left:24px;font-family:var(--mono);font-size:12px;">${s.l}</td><td class="na-c">—</td><td class="na-c">—</td><td>${fmt.num(s.cd)}</td><td><span class="pill yape">${fmt.pct(s.ed)}</span></td><td>${fmt.mm(s.dvd)}</td><td>${fmt.mm(s.rd)}</td></tr>`).join('');subDef=d.sub;}
  else if(!isYape&&key==='t130'){subDef=[{l:'Personas',k:'p130',n:'p130-res'},{l:'Pyme',k:'py130',n:'py130-res'}];subRows=subDef.map(s=>tRow(s.l,BCP[s.k],hasPre,false,s.n,'rs')).join('');}
  else if(!isYape&&key==='t3160'){subDef=[{l:'Personas',k:'p3160',n:'p3160-res'},{l:'Pyme (solo Trad.)',k:'py3160',n:'py3160-res',nd:true}];subRows=subDef.map(s=>tRow(s.l,BCP[s.k],false,false,s.n,'rs',s.nd)).join('');}
  p.innerHTML=`${bcHtml(key+'-res')}<div class="sec-hdr an"><div class="sec-title ${segEntity}">${title}</div><div class="sec-sub">${segEntity.toUpperCase()} · ${hasPre?'Pre · Dig · Trad':'Dig vs Trad'}</div></div>${hasPre?'':noPre()}${wlBanner(d.ed,d.et,title)}${kpiSection(d,hasPre,isYape)}${chartsBlock('bTrm','Clientes por Sub-segmento',title,'lTrm')}<div class="tbl-section an an4"><div class="tbl-hdr"><div class="tbl-title">Desglose</div><div class="tbl-badge">Toca → detalle</div></div><div class="tbl-scroll"><table>${tHead(hasPre,isYape)}<tbody>${subRows}</tbody></table></div></div>`;
  requestAnimationFrame(()=>{
    renderDonuts(d,hasPre,isYape);
    const col=entColor(segEntity);
    if(!isYape&&subDef.length){const lbls=subDef.map(s=>s.l);barCliChart('bTrm',lbls,[{label:'Digital',data:subDef.map(s=>{const r=BCP[s.k];return r&&!isZ(r.cd)?r.cd:null;}),backgroundColor:col,borderRadius:4,borderSkipped:false},{label:'Tradicional',data:subDef.map(s=>{const r=BCP[s.k];return r&&!isZ(r.ct)?r.ct:null;}),backgroundColor:CTRAD,borderRadius:4,borderSkipped:false,borderColor:'#94a3b8',borderWidth:1.5}]);}
    lineEfChart('lTrm');
  });
}

function renderPortRes(p,key,portLabel,tramoLabel,hasPre){
  const d=BCP[key];if(!d){p.innerHTML=bcHtml(key+'-res')+'<div class="no-data"><span>🔍</span>Sin datos</div>';return;}
  let segsKeys=[];
  if(key==='p130')segsKeys=[{l:'Seg A',k:'segA130',n:'segA130-res'},{l:'Seg B',k:'segB130',n:'segB130-res'},{l:'Seg C',k:'segC130',n:'segC130-res'},{l:'Seg D',k:'segD130',n:'segD130-res'}];
  if(key==='py130')segsKeys=[{l:'Seg A',k:'pyA130',n:'pyA130-res'},{l:'Seg B',k:'pyB130',n:'pyB130-res'},{l:'Seg C',k:'pyC130',n:'pyC130-res'},{l:'Seg D',k:'pyD130',n:'pyD130-res'}];
  if(key==='p3160')segsKeys=[{l:'0–1K',k:'p3160-0-1k',n:'p3160-0-1k'},{l:'1K–5K',k:'p3160-1k-5k',n:'p3160-1k-5k'},{l:'5K–20K',k:'p3160-5k-20k',n:'p3160-5k-20k'},{l:'20K–300K',k:'p3160-20k-300k',n:'p3160-20k-300k'},{l:'300K+',k:'p3160-300k',n:'p3160-300k'}];
  const rows=segsKeys.map(s=>tRow(s.l,BCP[s.k]||{},hasPre,false,s.n,'rs')).join('');
  p.innerHTML=`${bcHtml(key+'-res')}<div class="sec-hdr an"><div class="sec-title bcp">${portLabel}</div><div class="sec-sub">BCP · ${tramoLabel}</div></div>${hasPre?'':noPre()}${wlBanner(d.ed,d.et,portLabel)}${kpiSection(d,hasPre,false)}${chartsBlock('bPort',key==='p3160'?'Clientes por Ticket':'Clientes por Segmento',`${portLabel} · ${tramoLabel}`,'lPort')}<div class="tbl-section an an4"><div class="tbl-hdr"><div class="tbl-title">${key==='p3160'?'Tickets':'Segmentos'}</div><div class="tbl-badge">Toca → detalle</div></div><div class="tbl-scroll"><table>${tHead(hasPre,false)}<tbody>${rows}</tbody></table></div></div>`;
  requestAnimationFrame(()=>{
    renderDonuts(d,hasPre,false);
    const col=entColor(segEntity),lbls=segsKeys.map(s=>s.l);
    barCliChart('bPort',lbls,[{label:'Digital',data:segsKeys.map(s=>{const r=BCP[s.k];return r&&!isZ(r.cd)?r.cd:null;}),backgroundColor:col,borderRadius:4,borderSkipped:false},{label:'Tradicional',data:segsKeys.map(s=>{const r=BCP[s.k];return r&&!isZ(r.ct)?r.ct:null;}),backgroundColor:CTRAD,borderRadius:4,borderSkipped:false,borderColor:'#94a3b8',borderWidth:1.5}]);
    lineEfChart('lPort');
  });
}

function renderSegRes(p,key,segLabel,ctxLabel,hasPre){
  const d=BCP[key];if(!d){p.innerHTML=bcHtml(key+'-res')+'<div class="no-data"><span>🔍</span>Sin datos</div>';return;}
  const prefix=key,allTks=['0-1k','1k-5k','5k-20k','20k-300k','300k'],availTks=allTks.filter(tk=>BCP[prefix+'-'+tk]!=null);
  const rows=availTks.map(tk=>{const td=BCP[prefix+'-'+tk];const nd=isZ(td.cd)&&!isZ(td.ct);return tRow(TK[tk],td,hasPre,false,prefix+'-'+tk,'rs',nd);}).join('');
  p.innerHTML=`${bcHtml(key+'-res')}<div class="sec-hdr an"><div class="sec-title bcp">${segLabel}</div><div class="sec-sub">BCP · ${ctxLabel}</div></div>${hasPre?'':noPre()}${wlBanner(d.ed,d.et,segLabel)}${kpiSection(d,hasPre,false)}${chartsBlock('bSeg','Clientes por Ticket',`${segLabel} · ${ctxLabel}`,'lSeg')}<div class="tbl-section an an4"><div class="tbl-hdr"><div class="tbl-title">Tickets de Deuda</div><div class="tbl-badge">Toca → detalle</div></div><div class="tbl-scroll"><table>${tHead(hasPre,false)}<tbody>${rows}</tbody></table></div></div>`;
  requestAnimationFrame(()=>{
    renderDonuts(d,hasPre,false);
    const col=entColor(segEntity),lbls=availTks.map(tk=>TK[tk]);
    barCliChart('bSeg',lbls,[{label:'Digital',data:availTks.map(tk=>{const r=BCP[prefix+'-'+tk];return r&&!isZ(r.cd)?r.cd:null;}),backgroundColor:col,borderRadius:4,borderSkipped:false},{label:'Tradicional',data:availTks.map(tk=>{const r=BCP[prefix+'-'+tk];return r&&!isZ(r.ct)?r.ct:null;}),backgroundColor:CTRAD,borderRadius:4,borderSkipped:false,borderColor:'#94a3b8',borderWidth:1.5}]);
    lineEfChart('lSeg');
  });
}

function renderTicketBCP(p,prefix,tk,segLabel,ctxLabel,hasPre){
  if(hasPre===undefined)hasPre=true;
  const key=prefix+'-'+tk,d=BCP[key];
  if(!d){p.innerHTML=bcHtml(key)+'<div class="no-data"><span>🔍</span>Sin datos para este ticket</div>';return;}
  const nd=isZ(d.cd)&&!isZ(d.ct);
  p.innerHTML=`${bcHtml(key)}<div class="sec-hdr an"><div class="sec-title bcp">${TK[tk]||tk}</div><div class="sec-sub">BCP · ${segLabel} · ${ctxLabel}</div></div>${hasPre?'':noPre()}${wlBanner(nd?null:d.ed,d.et,TK[tk]||tk,nd)}${kpiSection(d,hasPre,false)}<div class="tbl-section an an3"><div class="tbl-hdr"><div class="tbl-title">Comparativo de Canales</div></div><div class="tbl-scroll"><table>${tHead(hasPre,false)}<tbody>${tRow(TK[tk]||tk,d,hasPre,false,null,'',nd)}</tbody></table></div></div>`;
  requestAnimationFrame(()=>renderDonuts(d,hasPre,false));
}

function renderSimple(p,key,title,sub,hasPre,hasTickets,noDig){
  const isYape=segEntity==='yape',src=isYape?YAPE:BCP,d=src[key];
  if(!d){p.innerHTML=bcHtml(currentView)+'<div class="no-data"><span>🔍</span>Sin datos</div>';return;}
  const nd=noDig||!!d.noDig||false;
  let extra='';
  if(hasTickets&&!isYape){const tks=['t121-0-1k','t121-1k'];extra=tks.map(tk=>tRow(TK[tk.replace('t121-','')]||tk,BCP[tk],hasPre,false,tk,'rs')).join('');}
  const yapeSub=isYape&&d.sub?d.sub.map(s=>`<tr><td style="padding-left:24px;font-family:var(--mono);font-size:12px;">${s.l}</td><td class="na-c">—</td><td class="na-c">—</td><td>${fmt.num(s.cd)}</td><td>${fmt.pct(s.ed)!=null?`<span class="pill yape">${fmt.pct(s.ed)}</span>`:'—'}</td><td>${fmt.mm(s.dvd)}</td><td>${fmt.mm(s.rd)}</td></tr>`).join(''):extra;
  p.innerHTML=`${bcHtml(currentView)}<div class="sec-hdr an"><div class="sec-title ${segEntity}">${title}</div><div class="sec-sub">${segEntity.toUpperCase()} · ${sub}</div></div>${hasPre?'':noPre()}${wlBanner(nd?null:d.ed,isZ(d.et)?null:d.et,title,nd)}${kpiSection(d,hasPre,isYape)}<div class="tbl-section an an3"><div class="tbl-hdr"><div class="tbl-title">Indicadores</div><div class="tbl-badge">${hasTickets||isYape&&d.sub?'Desglose disponible':'Sin zoom'}</div></div><div class="tbl-scroll"><table>${tHead(hasPre,isYape)}<tbody>${tRow(title,d,hasPre,isYape,null,'',nd)}${yapeSub}</tbody></table></div></div>`;
  requestAnimationFrame(()=>renderDonuts(d,hasPre,isYape));
}

function renderTicketSimple(p,key,label,tramoLabel){
  const d=BCP[key];if(!d){p.innerHTML=bcHtml(key)+'<div class="no-data"><span>🔍</span>Sin datos</div>';return;}
  const nd=isZ(d.cd)&&!isZ(d.ct);
  p.innerHTML=`${bcHtml(key)}<div class="sec-hdr an"><div class="sec-title bcp">${label}</div><div class="sec-sub">BCP · ${tramoLabel}</div></div>${noPre()}${wlBanner(nd?null:d.ed,d.et,label,nd)}${kpiSection(d,false,false)}<div class="tbl-section an an3"><div class="tbl-hdr"><div class="tbl-title">Comparativo</div></div><div class="tbl-scroll"><table>${tHead(false,false)}<tbody>${tRow(label,d,false,false,null,'',nd)}</tbody></table></div></div>`;
  requestAnimationFrame(()=>renderDonuts(d,false,false));
}

// INIT
renderIndicadores();
setIndEntity('general');
</script>
