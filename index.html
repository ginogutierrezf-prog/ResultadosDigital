<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Efectividad Canal Digital · Timing 19/06/2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #f4f5f8;
  --bg2:     #ffffff;
  --bg3:     #f8f9fb;
  --card:    #ffffff;
  --border:  #e4e7ef;
  --text:    #111827;
  --text2:   #374151;
  --muted:   #6b7280;
  --muted2:  #9ca3af;
  --vb:      #1d4ed8;
  --vb-lt:   #eff6ff;
  --wa:      #15803d;
  --wa-lt:   #f0fdf4;
  --yape:    #6d28d9;
  --yape-lt: #f5f3ff;
  --bcp:     #b91c1c;
  --bcp-lt:  #fff1f2;
  --green:   #15803d;
  --yellow:  #b45309;
  --red:     #b91c1c;
  --radius:  8px;
  --shadow:  0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; min-height: 100vh; }

/* ── HEADER ── */
.header {
  background: #0f172a;
  padding: 0 36px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px;
  position: sticky; top: 0; z-index: 100;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-mark { width: 28px; height: 28px; border-radius: 6px; background: var(--vb); display: flex; align-items: center; justify-content: center; }
.logo-mark svg { width: 14px; height: 14px; fill: #fff; }
.logo-name { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; color: #fff; letter-spacing: -.2px; }
.logo-name span { color: #60a5fa; }
.header-divider { width: 1px; height: 20px; background: #334155; margin: 0 4px; }
.header-sub { font-size: 12px; color: #94a3b8; font-weight: 400; }
.timing-badge {
  font-size: 11px; padding: 4px 12px; border-radius: 4px;
  background: rgba(96,165,250,.12); border: 1px solid rgba(96,165,250,.25);
  color: #93c5fd; font-weight: 500; letter-spacing: .3px;
}

/* ── CONTROLS ── */
.controls {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 0 36px; display: flex; align-items: center; gap: 24px;
  height: 48px;
}
.ctrl-label { font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .8px; }
.btn-group { display: flex; gap: 2px; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 2px; }
.tbtn {
  padding: 4px 14px; border-radius: 4px; border: none;
  background: transparent; color: var(--muted); cursor: pointer;
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
  transition: all .15s;
}
.tbtn:hover { color: var(--text); }
.tbtn.active { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.tbtn.active-vb { background: var(--vb); color: #fff; box-shadow: 0 1px 3px rgba(29,78,216,.3); }
.tbtn.active-wa { background: var(--wa); color: #fff; box-shadow: 0 1px 3px rgba(21,128,61,.3); }

/* legend */
.leg { display: flex; align-items: center; gap: 16px; margin-left: auto; }
.leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 500; }
.leg-swatch { width: 28px; height: 4px; border-radius: 2px; }

/* ── MAIN ── */
.main { padding: 24px 36px; }

/* ── SUMMARY ROW ── */
.summary-row { display: grid; grid-template-columns: repeat(6,1fr); gap: 10px; margin-bottom: 24px; }
.sum-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.sum-card::after {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--accent, var(--vb));
}
.sum-tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 6px; }
.sum-val { font-size: 20px; font-weight: 700; line-height: 1; color: var(--text); letter-spacing: -.5px; }
.sum-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
.sum-alc { font-size: 12px; font-weight: 600; margin-top: 5px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; }
.alc-g { background: #dcfce7; color: #15803d; }
.alc-y { background: #fef3c7; color: #92400e; }
.alc-r { background: #fee2e2; color: #991b1b; }

/* ── SECTION LABEL ── */
.section-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; color: var(--muted); margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px;
}
.section-label::after { content:''; flex:1; height:1px; background:var(--border); }

/* ── CHANNEL BLOCK ── */
.channel-block { margin-bottom: 28px; }
.ch-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-radius: 6px 6px 0 0;
  border: 1px solid var(--border); border-bottom: none;
}
.ch-label { font-size: 13px; font-weight: 700; color: #fff; letter-spacing: -.2px; }
.ch-sub { font-size: 11px; color: rgba(255,255,255,.7); font-weight: 400; }

/* ── ENTITY GRID ── */
.entity-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--border); border-radius: 0 0 6px 6px; overflow: hidden; background: var(--card); }
.entity-panel { padding: 0; border-right: 1px solid var(--border); }
.entity-panel:last-child { border-right: none; }

.entity-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  background: var(--bg3);
}
.entity-dot { width: 8px; height: 8px; border-radius: 50%; }
.entity-name { font-size: 12px; font-weight: 700; letter-spacing: -.1px; }
.entity-efect { font-size: 20px; font-weight: 700; margin-left: auto; letter-spacing: -.5px; }
.entity-alc { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-left: 8px; }

/* ── EFECTIVIDAD TABLE ── */
.ef-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.ef-table th {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px;
  color: var(--muted); padding: 7px 14px; text-align: right;
  border-bottom: 1px solid var(--border); background: var(--bg3); white-space: nowrap;
}
.ef-table th:first-child { text-align: left; }
.ef-table td { padding: 7px 14px; text-align: right; border-bottom: 1px solid var(--border); color: var(--text2); }
.ef-table td:first-child { text-align: left; font-weight: 500; color: var(--text); padding-left: 16px; }
.ef-table tbody tr:last-child td { border-bottom: none; }
.ef-table tbody tr:hover { background: var(--bg3); }
.alc-pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 600; }

/* ── CHART SECTION ── */
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.chart-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  box-shadow: var(--shadow);
}
.chart-card-header { margin-bottom: 14px; }
.chart-card-title { font-size: 12px; font-weight: 700; color: var(--text); letter-spacing: -.1px; }
.chart-card-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.chart-box { position: relative; height: 220px; }

@media(max-width:960px){
  .summary-row { grid-template-columns: repeat(3,1fr); }
  .entity-grid, .charts-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 16 16"><path d="M2 12 L8 2 L14 12 Z"/></svg>
    </div>
    <span class="logo-name">COBR<span>ANZA</span> DIGITAL</span>
    <div class="header-divider"></div>
    <span class="header-sub">Efectividad Canal Digital · Abr – Jun 2026</span>
  </div>
  <span class="timing-badge">Timing · 19 Jun 2026</span>
</div>

<div class="controls">
  <span class="ctrl-label">Canal</span>
  <div class="btn-group">
    <button class="tbtn active" id="btn-both" onclick="setCanal('both')">Ambos</button>
    <button class="tbtn" id="btn-vb"   onclick="setCanal('vb')">Voicebot</button>
    <button class="tbtn" id="btn-wa"   onclick="setCanal('wa')">WhatsApp</button>
  </div>
  <div class="leg">
    <span style="font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.8px">Alcance:</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#bbf7d0"></span>≥ 90%</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fde68a"></span>70 – 89%</span>
    <span class="leg-item"><span class="leg-swatch" style="background:#fecaca"></span>&lt; 70%</span>
  </div>
</div>

<div class="main">
  <div class="summary-row" id="summary-row"></div>
  <div id="channel-blocks"></div>
  <div class="section-label">Efectividad Jun-26 vs Meta · Por Tramo</div>
  <div class="charts-row" id="charts-row"></div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const MESES = ['Abr-26','May-26','Jun-26'];

const DATA = {
  vb: {
    label: 'Voicebot', color: '#1d4ed8', colorLt: '#eff6ff',
    total: { efect:[0.4015,0.3824,0.3869], meta:0.3824 },
    yape: { efect:[0.2914,0.2573,0.2509], meta:0.2576,
      tramos: {
        '1–8':    { efect:[0.4445,0.4595,0.4499], meta:0.4501 },
        '9–30':   { efect:[0.3420,0.3213,0.3219], meta:0.3367 },
        '31–60':  { efect:[0.1345,0.1401,0.1258], meta:0.1382 },
        '61–120': { efect:[0.0600,0.0584,0.0537], meta:0.0619 },
      }
    },
    bcp: { efect:[0.4787,0.4803,0.4966], meta:0.4863,
      tramos: {
        '1–8':    { efect:[0.5552,0.5374,0.5691], meta:0.5529 },
        '9–30':   { efect:[0.4015,0.4439,0.4459], meta:0.4349 },
        '31–60':  { efect:[0.1682,0.1692,0.1073], meta:0.1623 },
        '61–120': { efect:[0.0426,0.0459,0.0284], meta:0.0475 },
        '+120':   { efect:[0.0226,0.0270,0.0028], meta:0.0209 },
      }
    },
  },
  wa: {
    label: 'WhatsApp', color: '#15803d', colorLt: '#f0fdf4',
    total: { efect:[0.3697,0.3578,0.3422], meta:0.3491 },
    yape: { efect:[0.3050,0.2804,0.2703], meta:0.2746,
      tramos: {
        '1–8':    { efect:[0.4522,0.4666,0.4612], meta:0.4548 },
        '9–30':   { efect:[0.3070,0.3452,0.3309], meta:0.3378 },
        '31–60':  { efect:[0.1245,0.1600,0.1392], meta:0.1458 },
        '61–120': { efect:[0.0846,0.0637,0.0571], meta:0.0730 },
      }
    },
    bcp: { efect:[0.4946,0.5035,0.4747], meta:0.4864,
      tramos: {
        '1–8':    { efect:[0.5300,0.5681,0.5446], meta:0.5404 },
        '9–30':   { efect:[0.4338,0.4297,0.3565], meta:0.4369 },
        '31–60':  { efect:[0.1973,0.1482,0.1268], meta:0.1682 },
        '61–120': { efect:[0.0680,0.0455,0.0500], meta:0.0622 },
      }
    },
  },
};

const ENTITY_CFG = {
  yape: { label:'Yape', color:'#6d28d9', bgCol:'#f5f3ff' },
  bcp:  { label:'BCP',  color:'#b91c1c', bgCol:'#fff1f2' },
};

let currentCanal = 'both';
const charts = {};

// ── HELPERS ───────────────────────────────────────────────────────────────────
const fp = v => v != null ? (v*100).toFixed(2)+'%' : '—';
const alc = (e,m) => m ? e/m : null;

function alcCls(p) {
  if (p===null) return '';
  return p>=.9 ? 'alc-g' : p>=.7 ? 'alc-y' : 'alc-r';
}
function alcIcon(p) { return p===null?'—': p>=.9?'✓': p>=.7?'△':'✕'; }
function alcPill(p) {
  if (p===null) return '—';
  return `<span class="alc-pill ${alcCls(p)}">${alcIcon(p)} ${(p*100).toFixed(1)}%</span>`;
}

// ── SUMMARY CARDS ─────────────────────────────────────────────────────────────
function renderSummary() {
  const canales = currentCanal==='both' ? ['vb','wa'] : [currentCanal];
  let html = '';
  canales.forEach(ch => {
    const d = DATA[ch];
    ['total','yape','bcp'].forEach(ent => {
      const ed = d[ent];
      const p = alc(ed.efect[2], ed.meta);
      const entLabel = ent==='total' ? d.label+' Total' : d.label+' · '+(ent==='yape'?'Yape':'BCP');
      const acc = ent==='total' ? d.color : ENTITY_CFG[ent].color;
      html += `
      <div class="sum-card" style="--accent:${acc}">
        <div class="sum-tag">${entLabel}</div>
        <div class="sum-val">${fp(ed.efect[2])}</div>
        <div class="sum-meta">Meta ${fp(ed.meta)}</div>
        <div class="sum-alc ${alcCls(p)}">${alcIcon(p)} ${p!==null?(p*100).toFixed(1)+'%':'—'}</div>
      </div>`;
    });
  });
  // Adjust grid cols
  const count = canales.length * 3;
  document.getElementById('summary-row').style.gridTemplateColumns = `repeat(${count},1fr)`;
  document.getElementById('summary-row').innerHTML = html;
}

// ── TABLE ROWS ────────────────────────────────────────────────────────────────
function entityPanel(ch, ent) {
  const d    = DATA[ch][ent];
  const cfg  = ENTITY_CFG[ent];
  const ep   = alc(d.efect[2], d.meta);
  const trs  = Object.keys(d.tramos);
  return `
  <div class="entity-panel">
    <div class="entity-header" style="background:${cfg.bgCol}">
      <div class="entity-dot" style="background:${cfg.color}"></div>
      <span class="entity-name" style="color:${cfg.color}">${cfg.label}</span>
      <span class="entity-efect" style="color:${cfg.color}">${fp(d.efect[2])}</span>
      <span class="entity-alc ${alcCls(ep)}">${alcIcon(ep)} ${ep!==null?(ep*100).toFixed(1)+'%':'—'}</span>
    </div>
    <table class="ef-table">
      <thead><tr>
        <th>Tramo</th><th>Abr-26</th><th>May-26</th><th>Jun-26</th><th>Meta</th><th>Alcance</th>
      </tr></thead>
      <tbody>
        <tr style="background:${cfg.bgCol}88">
          <td style="font-weight:700;color:${cfg.color}">Total ${cfg.label}</td>
          <td>${fp(d.efect[0])}</td><td>${fp(d.efect[1])}</td><td>${fp(d.efect[2])}</td>
          <td style="color:var(--muted)">${fp(d.meta)}</td>
          <td>${alcPill(ep)}</td>
        </tr>
        ${trs.map(tr => {
          const t = d.tramos[tr];
          const tp = alc(t.efect[2], t.meta);
          return `<tr>
            <td style="padding-left:24px;color:var(--muted2);font-size:11px">${tr}</td>
            <td>${fp(t.efect[0])}</td><td>${fp(t.efect[1])}</td><td>${fp(t.efect[2])}</td>
            <td style="color:var(--muted)">${fp(t.meta)}</td>
            <td>${alcPill(tp)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

function renderBlocks() {
  const canales = currentCanal==='both' ? ['vb','wa'] : [currentCanal];
  let html = '';
  canales.forEach(ch => {
    const d = DATA[ch];
    html += `
    <div class="channel-block">
      <div class="ch-header" style="background:${d.color}">
        <span class="ch-label">${d.label}</span>
        <span class="ch-sub">Efectividad al timing 19/06/2026</span>
        <span style="margin-left:auto;font-size:11px;color:rgba(255,255,255,.8)">Total Jun-26: <strong style="color:#fff">${fp(d.total.efect[2])}</strong></span>
      </div>
      <div class="entity-grid">
        ${entityPanel(ch,'yape')}
        ${entityPanel(ch,'bcp')}
      </div>
    </div>`;
  });
  document.getElementById('channel-blocks').innerHTML = html;
}

// ── BAR CHARTS: Real vs Meta por Tramo ───────────────────────────────────────
function buildBarChart(canvasId, ch, ent) {
  const d     = DATA[ch][ent];
  const cfg   = ENTITY_CFG[ent];
  const trs   = Object.keys(d.tramos);
  const real  = trs.map(tr => d.tramos[tr].efect[2]);
  const meta  = trs.map(tr => d.tramos[tr].meta);
  const alcPs = trs.map(tr => alc(d.tramos[tr].efect[2], d.tramos[tr].meta));

  // Bar colors based on alcance
  const barColors = alcPs.map(p =>
    p===null ? '#e5e7eb' : p>=.9 ? '#86efac' : p>=.7 ? '#fde68a' : '#fca5a5'
  );
  const barBorders = alcPs.map(p =>
    p===null ? '#d1d5db' : p>=.9 ? '#15803d' : p>=.7 ? '#d97706' : '#dc2626'
  );

  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  try { if (charts[canvasId]) charts[canvasId].destroy(); } catch(e){}

  charts[canvasId] = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: trs,
      datasets: [
        {
          label: 'Efectividad Jun-26',
          data: real,
          backgroundColor: barColors,
          borderColor: barBorders,
          borderWidth: 1.5,
          borderRadius: 4,
          order: 2,
        },
        {
          label: 'Meta',
          data: meta,
          type: 'line',
          borderColor: cfg.color,
          backgroundColor: 'transparent',
          borderWidth: 2,
          borderDash: [5,4],
          pointRadius: 4,
          pointBackgroundColor: cfg.color,
          pointBorderColor: '#fff',
          pointBorderWidth: 1.5,
          tension: 0,
          order: 1,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode:'index', intersect:false },
      plugins: {
        legend: {
          display: true,
          labels: { color:'#6b7280', font:{family:'Inter',size:11}, boxWidth:10, boxHeight:10, padding:14 }
        },
        tooltip: {
          backgroundColor:'#1e293b', borderColor:'#334155', borderWidth:1,
          titleColor:'#f1f5f9', bodyColor:'#cbd5e1',
          titleFont:{family:'Inter',size:12,weight:'600'}, bodyFont:{family:'Inter',size:11}, padding:10,
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${(ctx.parsed.y*100).toFixed(2)}%`,
            afterBody: items => {
              const i = items[0].dataIndex;
              const p = alcPs[i];
              if (p===null) return '';
              const icon = p>=.9?'✓':p>=.7?'△':'✕';
              return `\n ${icon} Alcance: ${(p*100).toFixed(1)}%`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display:false },
          ticks: { color:'#6b7280', font:{family:'Inter',size:11} }
        },
        y: {
          grid: { color:'rgba(226,232,240,.8)' },
          ticks: { color:'#6b7280', font:{family:'Inter',size:11}, callback:v=>(v*100).toFixed(0)+'%' },
          min: 0
        }
      }
    }
  });
}

function renderCharts() {
  const canales = currentCanal==='both' ? ['vb','wa'] : [currentCanal];
  let html = '';
  canales.forEach(ch => {
    ['yape','bcp'].forEach(ent => {
      const cfg = ENTITY_CFG[ent];
      const id  = `chart-${ch}-${ent}`;
      html += `
      <div class="chart-card">
        <div class="chart-card-header">
          <div class="chart-card-title">${DATA[ch].label} · ${cfg.label}</div>
          <div class="chart-card-sub">Efectividad real vs meta por tramo — Jun-26</div>
        </div>
        <div class="chart-box"><canvas id="${id}"></canvas></div>
      </div>`;
    });
  });
  document.getElementById('charts-row').innerHTML = html;
  setTimeout(() => {
    canales.forEach(ch => ['yape','bcp'].forEach(ent => buildBarChart(`chart-${ch}-${ent}`, ch, ent)));
  }, 40);
}

// ── CONTROLS ──────────────────────────────────────────────────────────────────
function setCanal(c) {
  currentCanal = c;
  document.getElementById('btn-both').className = 'tbtn'+(c==='both'?' active':'');
  document.getElementById('btn-vb').className   = 'tbtn'+(c==='vb'  ?' active-vb':'');
  document.getElementById('btn-wa').className   = 'tbtn'+(c==='wa'  ?' active-wa':'');
  renderAll();
}

function renderAll() { renderSummary(); renderBlocks(); renderCharts(); }
document.addEventListener('DOMContentLoaded', renderAll);
</script>
</body>
</html>
